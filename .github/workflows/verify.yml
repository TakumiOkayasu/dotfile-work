name: verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        # actions/checkout v5, pinned to an audited commit.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Verify PowerShell profile and installer
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tests/test_powershell.ps1

  generated-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v5, pinned to an audited commit.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Generate and verify install-time AI assets
        run: |
          python3 scripts/generate-ai-assets.py --repo .
          python3 tests/test_generate_ai_assets.py
          python3 tests/test_ai_knowledge_policy.py
          python3 tests/test_ai_qcd.py
          python3 tests/test_ai_knowledge_sync.py
          python3 tests/test_ai_knowledge_search.py
          python3 tests/test_ai_knowledge_secret_redaction.py

      - name: Require canonical sources to remain unchanged
        run: git diff --exit-code

  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v5, pinned to an audited commit.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Run hook tests
        run: docker compose -f tests/compose.yml run --rm hooks-test

      - name: Run Codex hook tests
        run: docker compose -f tests/compose.yml run --rm codex-hooks-test

      - name: Run CLI tests
        run: docker compose -f tests/compose.yml run --rm bin-test

      - name: Run shell lint tests
        run: docker compose -f tests/compose.yml run --rm shell-lint-test

      - name: Run installer and asset pipeline tests
        run: docker compose -f tests/compose.yml run --rm install-test
